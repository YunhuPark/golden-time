name: One-off route cache patch

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  patch-route-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/route-memory-cache

      - name: Add short-lived in-memory route cache
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/data/datasources/remote/KakaoDirectionsClient.ts')
          text = path.read_text(encoding='utf-8')

          insert_after = """export interface RouteInfo {\n  distance: number; // 거리 (미터)\n  duration: number; // 소요시간 (초)\n  taxiFare: number; // 택시 요금 (원)\n  tollFare: number; // 통행료 (원)\n}\n"""
          cache_block = """

type RouteCacheEntry = {\n  routeInfo: RouteInfo;\n  expiresAt: number;\n};\n\n// Route data is traffic-sensitive, so keep it only briefly and only in memory.\n// This avoids persisting precise user location while still making same-session\n// refreshes much faster.\nconst ROUTE_CACHE_TTL_MS = 60_000;\nconst ROUTE_CACHE_MAX_ENTRIES = 100;\nconst routeCache = new Map<string, RouteCacheEntry>();\nconst routeRequestsInFlight = new Map<string, Promise<RouteInfo | null>>();\n\nconst buildRouteCacheKey = (\n  origin: { latitude: number; longitude: number },\n  destination: { latitude: number; longitude: number },\n  priority: RoutePriority\n): string => {\n  // Round only the user's origin enough to absorb normal GPS jitter (~10m).\n  // Hospital coordinates stay more precise to avoid collisions.\n  const originKey = `${origin.latitude.toFixed(4)},${origin.longitude.toFixed(4)}`;\n  const destinationKey = `${destination.latitude.toFixed(5)},${destination.longitude.toFixed(5)}`;\n  return `${priority}:${originKey}>${destinationKey}`;\n};\n"""

          if text.count(insert_after) != 1:
              raise SystemExit('RouteInfo insertion point not found exactly once')
          text = text.replace(insert_after, insert_after + cache_block, 1)

          start_marker = """  async getRouteInfo(\n    origin: { latitude: number; longitude: number },\n    destination: { latitude: number; longitude: number },\n    priority: RoutePriority = 'RECOMMEND'\n  ): Promise<RouteInfo | null> {\n"""
          end_marker = """\n  /**\n   * 여러 목적지까지의 경로 정보를 배치로 계산 (동시성 제어 및 실패 격리)\n"""
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = """  async getRouteInfo(\n    origin: { latitude: number; longitude: number },\n    destination: { latitude: number; longitude: number },\n    priority: RoutePriority = 'RECOMMEND'\n  ): Promise<RouteInfo | null> {\n    // Edge Case 1: 출발지와 목적지가 동일한 경우\n    if (\n      origin.latitude === destination.latitude &&\n      origin.longitude === destination.longitude\n    ) {\n      console.warn('getRouteInfo: Origin and destination are the same');\n      return {\n        distance: 0,\n        duration: 0,\n        taxiFare: 0,\n        tollFare: 0,\n      };\n    }\n\n    // Edge Case 2: 좌표 유효성 검증\n    if (!this.isValidCoordinate(origin) || !this.isValidCoordinate(destination)) {\n      console.error('getRouteInfo: Invalid coordinates', { origin, destination });\n      return null;\n    }\n\n    const cacheKey = buildRouteCacheKey(origin, destination, priority);\n    const cached = routeCache.get(cacheKey);\n    if (cached) {\n      if (cached.expiresAt > Date.now()) {\n        return cached.routeInfo;\n      }\n      routeCache.delete(cacheKey);\n    }\n\n    // Multiple callers (or newly-created repository instances) can request the\n    // same route at once. Share the same promise instead of hitting Kakao twice.\n    const inFlight = routeRequestsInFlight.get(cacheKey);\n    if (inFlight) {\n      return inFlight;\n    }\n\n    const request = this.fetchRouteInfoUncached(origin, destination, priority)\n      .then((routeInfo) => {\n        if (routeInfo) {\n          this.cacheRoute(cacheKey, routeInfo);\n        }\n        return routeInfo;\n      })\n      .finally(() => {\n        routeRequestsInFlight.delete(cacheKey);\n      });\n\n    routeRequestsInFlight.set(cacheKey, request);\n    return request;\n  }\n\n  private async fetchRouteInfoUncached(\n    origin: { latitude: number; longitude: number },\n    destination: { latitude: number; longitude: number },\n    priority: RoutePriority\n  ): Promise<RouteInfo | null> {\n    const url = new URL('/api/kakao/directions', window.location.origin);\n\n    // origin/destination 형식: \"경도,위도\" (주의: x=경도, y=위도)\n    url.searchParams.set('origin', `${origin.longitude},${origin.latitude}`);\n    url.searchParams.set(\n      'destination',\n      `${destination.longitude},${destination.latitude}`\n    );\n    url.searchParams.set('priority', priority);\n\n    try {\n      const response = await this.fetchWithRetry<KakaoDirectionsResponse>(\n        url.toString()\n      );\n\n      if (!response.routes || response.routes.length === 0) {\n        console.warn('getRouteInfo: No routes found in response');\n        return null;\n      }\n\n      const firstRoute = response.routes[0];\n      if (!firstRoute) {\n        console.warn('getRouteInfo: First route is undefined');\n        return null;\n      }\n\n      if (firstRoute.result_code !== 0) {\n        console.warn(\n          `getRouteInfo: Route search failed - ${firstRoute.result_msg} (code: ${firstRoute.result_code})`\n        );\n        return null;\n      }\n\n      const { summary } = firstRoute;\n      if (!summary) {\n        console.error('getRouteInfo: Summary is undefined');\n        return null;\n      }\n\n      if (\n        typeof summary.distance !== 'number' ||\n        typeof summary.duration !== 'number'\n      ) {\n        console.error('getRouteInfo: Invalid summary data', summary);\n        return null;\n      }\n\n      return {\n        distance: summary.distance,\n        duration: summary.duration,\n        taxiFare: summary.fare?.taxi || 0,\n        tollFare: summary.fare?.toll || 0,\n      };\n    } catch (error) {\n      console.error(\n        `getRouteInfo failed from (${origin.latitude}, ${origin.longitude}) to (${destination.latitude}, ${destination.longitude}):`,\n        error\n      );\n      return null;\n    }\n  }\n\n  private cacheRoute(cacheKey: string, routeInfo: RouteInfo): void {\n    const now = Date.now();\n\n    for (const [key, entry] of routeCache) {\n      if (entry.expiresAt <= now) {\n        routeCache.delete(key);\n      }\n    }\n\n    if (routeCache.size >= ROUTE_CACHE_MAX_ENTRIES) {\n      const oldestKey = routeCache.keys().next().value as string | undefined;\n      if (oldestKey) {\n        routeCache.delete(oldestKey);\n      }\n    }\n\n    routeCache.set(cacheKey, {\n      routeInfo,\n      expiresAt: now + ROUTE_CACHE_TTL_MS,\n    });\n  }\n"""

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Add cache tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/data/datasources/remote/KakaoDirectionsClient.test.ts')
          text = path.read_text(encoding='utf-8')
          marker = """  describe('getBatchRouteInfoConcurrent', () => {\n"""
          tests = """  describe('route memory cache', () => {\n    const response = {\n      routes: [{\n        result_code: 0,\n        result_msg: 'OK',\n        summary: {\n          distance: 1200,\n          duration: 480,\n          fare: { taxi: 5000, toll: 0 },\n        },\n      }],\n    };\n\n    it('reuses a recent route across client instances', async () => {\n      const origin = { latitude: 37.55121, longitude: 126.98821 };\n      const destination = { latitude: 37.56123, longitude: 126.99823 };\n      const firstClient = new KakaoDirectionsClient();\n      const secondClient = new KakaoDirectionsClient();\n      const firstFetch = vi.fn().mockResolvedValue(response);\n      const secondFetch = vi.fn().mockResolvedValue(response);\n      (firstClient as any).fetchWithRetry = firstFetch;\n      (secondClient as any).fetchWithRetry = secondFetch;\n\n      const first = await firstClient.getRouteInfo(origin, destination);\n      const second = await secondClient.getRouteInfo(origin, destination);\n\n      expect(first).toEqual(second);\n      expect(firstFetch).toHaveBeenCalledTimes(1);\n      expect(secondFetch).not.toHaveBeenCalled();\n    });\n\n    it('deduplicates concurrent requests for the same route', async () => {\n      const origin = { latitude: 35.15951, longitude: 126.85261 };\n      const destination = { latitude: 35.16953, longitude: 126.86263 };\n      const firstClient = new KakaoDirectionsClient();\n      const secondClient = new KakaoDirectionsClient();\n      let resolveRequest: ((value: unknown) => void) | undefined;\n      const pendingResponse = new Promise((resolve) => { resolveRequest = resolve; });\n      const firstFetch = vi.fn().mockReturnValue(pendingResponse);\n      const secondFetch = vi.fn().mockResolvedValue(response);\n      (firstClient as any).fetchWithRetry = firstFetch;\n      (secondClient as any).fetchWithRetry = secondFetch;\n\n      const firstPromise = firstClient.getRouteInfo(origin, destination);\n      const secondPromise = secondClient.getRouteInfo(origin, destination);\n      resolveRequest?.(response);\n      const [first, second] = await Promise.all([firstPromise, secondPromise]);\n\n      expect(first).toEqual(second);\n      expect(firstFetch).toHaveBeenCalledTimes(1);\n      expect(secondFetch).not.toHaveBeenCalled();\n    });\n\n    it('expires cached route data after the short TTL', async () => {\n      const nowSpy = vi.spyOn(Date, 'now');\n      const origin = { latitude: 35.87111, longitude: 128.60111 };\n      const destination = { latitude: 35.88113, longitude: 128.61113 };\n      const firstClient = new KakaoDirectionsClient();\n      const secondClient = new KakaoDirectionsClient();\n      const firstFetch = vi.fn().mockResolvedValue(response);\n      const secondFetch = vi.fn().mockResolvedValue(response);\n      (firstClient as any).fetchWithRetry = firstFetch;\n      (secondClient as any).fetchWithRetry = secondFetch;\n\n      nowSpy.mockReturnValue(1_000);\n      await firstClient.getRouteInfo(origin, destination);\n      nowSpy.mockReturnValue(61_001);\n      await secondClient.getRouteInfo(origin, destination);\n\n      expect(firstFetch).toHaveBeenCalledTimes(1);\n      expect(secondFetch).toHaveBeenCalledTimes(1);\n      nowSpy.mockRestore();\n    });\n  });\n\n"""
          if text.count(marker) != 1:
              raise SystemExit('Test insertion point not found exactly once')
          text = text.replace(marker, tests + marker, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify targeted tests
        run: |
          npm ci
          npx vitest run src/data/datasources/remote/KakaoDirectionsClient.test.ts

      - name: Commit route cache to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/datasources/remote/KakaoDirectionsClient.ts src/data/datasources/remote/KakaoDirectionsClient.test.ts
          git commit -m "Cache recent Kakao route results in memory"
          git push origin HEAD:perf/route-memory-cache
