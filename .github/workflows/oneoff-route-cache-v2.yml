name: One-off route cache v2

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/route-memory-cache
      - name: Patch client
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('src/data/datasources/remote/KakaoDirectionsClient.ts')
          s = p.read_text(encoding='utf-8')
          anchor = """export interface RouteInfo {\n  distance: number; // 거리 (미터)\n  duration: number; // 소요시간 (초)\n  taxiFare: number; // 택시 요금 (원)\n  tollFare: number; // 통행료 (원)\n}\n"""
          extra = """

type RouteCacheEntry = { routeInfo: RouteInfo; expiresAt: number };\nconst ROUTE_CACHE_TTL_MS = 60_000;\nconst ROUTE_CACHE_MAX_ENTRIES = 100;\nconst routeCache = new Map<string, RouteCacheEntry>();\nconst routeRequestsInFlight = new Map<string, Promise<RouteInfo | null>>();\n\nconst buildRouteCacheKey = (\n  origin: { latitude: number; longitude: number },\n  destination: { latitude: number; longitude: number },\n  priority: RoutePriority\n): string => {\n  const originKey = `${origin.latitude.toFixed(4)},${origin.longitude.toFixed(4)}`;\n  const destinationKey = `${destination.latitude.toFixed(5)},${destination.longitude.toFixed(5)}`;\n  return `${priority}:${originKey}>${destinationKey}`;\n};\n"""
          if s.count(anchor) != 1: raise SystemExit('anchor mismatch')
          s = s.replace(anchor, anchor + extra, 1)
          start_marker = """  async getRouteInfo(\n    origin: { latitude: number; longitude: number },\n    destination: { latitude: number; longitude: number },\n    priority: RoutePriority = 'RECOMMEND'\n  ): Promise<RouteInfo | null> {\n"""
          end_marker = """\n  /**\n   * 여러 목적지까지의 경로 정보를 배치로 계산 (동시성 제어 및 실패 격리)\n"""
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = """  async getRouteInfo(\n    origin: { latitude: number; longitude: number },\n    destination: { latitude: number; longitude: number },\n    priority: RoutePriority = 'RECOMMEND'\n  ): Promise<RouteInfo | null> {\n    if (origin.latitude === destination.latitude && origin.longitude === destination.longitude) {\n      return { distance: 0, duration: 0, taxiFare: 0, tollFare: 0 };\n    }\n    if (!this.isValidCoordinate(origin) || !this.isValidCoordinate(destination)) return null;\n\n    const cacheKey = buildRouteCacheKey(origin, destination, priority);\n    const cached = routeCache.get(cacheKey);\n    if (cached) {\n      if (cached.expiresAt > Date.now()) return cached.routeInfo;\n      routeCache.delete(cacheKey);\n    }\n    const inFlight = routeRequestsInFlight.get(cacheKey);\n    if (inFlight) return inFlight;\n\n    const request = this.fetchRouteInfoUncached(origin, destination, priority)\n      .then((routeInfo) => {\n        if (routeInfo) this.cacheRoute(cacheKey, routeInfo);\n        return routeInfo;\n      })\n      .finally(() => routeRequestsInFlight.delete(cacheKey));\n    routeRequestsInFlight.set(cacheKey, request);\n    return request;\n  }\n\n  private async fetchRouteInfoUncached(\n    origin: { latitude: number; longitude: number },\n    destination: { latitude: number; longitude: number },\n    priority: RoutePriority\n  ): Promise<RouteInfo | null> {\n    const url = new URL('/api/kakao/directions', window.location.origin);\n    url.searchParams.set('origin', `${origin.longitude},${origin.latitude}`);\n    url.searchParams.set('destination', `${destination.longitude},${destination.latitude}`);\n    url.searchParams.set('priority', priority);\n    try {\n      const response = await this.fetchWithRetry<KakaoDirectionsResponse>(url.toString());\n      const firstRoute = response.routes?.[0];\n      if (!firstRoute || firstRoute.result_code !== 0 || !firstRoute.summary) return null;\n      const { summary } = firstRoute;\n      if (typeof summary.distance !== 'number' || typeof summary.duration !== 'number') return null;\n      return { distance: summary.distance, duration: summary.duration, taxiFare: summary.fare?.taxi || 0, tollFare: summary.fare?.toll || 0 };\n    } catch (error) {\n      console.error('getRouteInfo failed:', error);\n      return null;\n    }\n  }\n\n  private cacheRoute(cacheKey: string, routeInfo: RouteInfo): void {\n    const now = Date.now();\n    for (const [key, entry] of routeCache) if (entry.expiresAt <= now) routeCache.delete(key);\n    if (routeCache.size >= ROUTE_CACHE_MAX_ENTRIES) {\n      const oldestKey = routeCache.keys().next().value as string | undefined;\n      if (oldestKey) routeCache.delete(oldestKey);\n    }\n    routeCache.set(cacheKey, { routeInfo, expiresAt: now + ROUTE_CACHE_TTL_MS });\n  }\n"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Patch tests
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('src/data/datasources/remote/KakaoDirectionsClient.test.ts')
          s = p.read_text(encoding='utf-8')
          marker = """  describe('getBatchRouteInfoConcurrent', () => {\n"""
          tests = """  describe('route memory cache', () => {\n    const response = { routes: [{ result_code: 0, result_msg: 'OK', summary: { distance: 1200, duration: 480, fare: { taxi: 5000, toll: 0 } } }] };\n\n    it('reuses a recent route across client instances', async () => {\n      const origin = { latitude: 37.55121, longitude: 126.98821 };\n      const destination = { latitude: 37.56123, longitude: 126.99823 };\n      const a = new KakaoDirectionsClient();\n      const b = new KakaoDirectionsClient();\n      const fetchA = vi.fn().mockResolvedValue(response);\n      const fetchB = vi.fn().mockResolvedValue(response);\n      (a as any).fetchWithRetry = fetchA;\n      (b as any).fetchWithRetry = fetchB;\n      expect(await a.getRouteInfo(origin, destination)).toEqual(await b.getRouteInfo(origin, destination));\n      expect(fetchA).toHaveBeenCalledTimes(1);\n      expect(fetchB).not.toHaveBeenCalled();\n    });\n\n    it('deduplicates concurrent same-route requests', async () => {\n      const origin = { latitude: 35.15951, longitude: 126.85261 };\n      const destination = { latitude: 35.16953, longitude: 126.86263 };\n      const a = new KakaoDirectionsClient();\n      const b = new KakaoDirectionsClient();\n      let resolveRequest!: (value: typeof response) => void;\n      const pending = new Promise<typeof response>((resolve) => { resolveRequest = resolve; });\n      const fetchA = vi.fn().mockReturnValue(pending);\n      const fetchB = vi.fn().mockResolvedValue(response);\n      (a as any).fetchWithRetry = fetchA;\n      (b as any).fetchWithRetry = fetchB;\n      const first = a.getRouteInfo(origin, destination);\n      const second = b.getRouteInfo(origin, destination);\n      resolveRequest(response);\n      const [r1, r2] = await Promise.all([first, second]);\n      expect(r1).toEqual(r2);\n      expect(fetchA).toHaveBeenCalledTimes(1);\n      expect(fetchB).not.toHaveBeenCalled();\n    });\n\n    it('expires cached route data after 60 seconds', async () => {\n      const now = vi.spyOn(Date, 'now');\n      const origin = { latitude: 35.87111, longitude: 128.60111 };\n      const destination = { latitude: 35.88113, longitude: 128.61113 };\n      const a = new KakaoDirectionsClient();\n      const b = new KakaoDirectionsClient();\n      const fetchA = vi.fn().mockResolvedValue(response);\n      const fetchB = vi.fn().mockResolvedValue(response);\n      (a as any).fetchWithRetry = fetchA;\n      (b as any).fetchWithRetry = fetchB;\n      now.mockReturnValue(1_000);\n      await a.getRouteInfo(origin, destination);\n      now.mockReturnValue(61_001);\n      await b.getRouteInfo(origin, destination);\n      expect(fetchA).toHaveBeenCalledTimes(1);\n      expect(fetchB).toHaveBeenCalledTimes(1);\n      now.mockRestore();\n    });\n  });\n\n"""
          if s.count(marker) != 1: raise SystemExit('test marker mismatch')
          p.write_text(s.replace(marker, tests + marker, 1), encoding='utf-8')
      - name: Test
        run: |
          npm ci
          npx vitest run src/data/datasources/remote/KakaoDirectionsClient.test.ts
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/datasources/remote/KakaoDirectionsClient.ts src/data/datasources/remote/KakaoDirectionsClient.test.ts
          git commit -m "Cache recent Kakao route results in memory"
          git push origin HEAD:perf/route-memory-cache
