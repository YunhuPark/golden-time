name: Remove Ineffective Ranking Import

on:
  push:
    branches:
      - chore/remove-ineffective-ranking-import
    paths:
      - .github/workflows/remove-ineffective-ranking-import.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-ineffective-ranking-import
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Replace ineffective dynamic ranking import
        run: |
          node <<'NODE'
          const fs = require('fs');

          {
            const path = 'src/presentation/pages/HomePage.tsx';
            let text = fs.readFileSync(path, 'utf8');
            const importAnchor = "import { applyFilters } from '../../domain/types/HospitalFilter';\n";
            const staticImport = "import { HospitalRankingService } from '../../domain/services/HospitalRankingService';\n";
            if (!text.includes(importAnchor)) throw new Error('HomePage import anchor missing');
            if (!text.includes(staticImport)) text = text.replace(importAnchor, importAnchor + staticImport);
            const dynamicImport = "            const { HospitalRankingService } = await import('../../domain/services/HospitalRankingService');\n";
            if (!text.includes(dynamicImport)) throw new Error('Dynamic ranking import missing');
            text = text.replace(dynamicImport, '');
            fs.writeFileSync(path, text);
          }

          {
            const path = 'src/presentation/pages/HomePage.test.tsx';
            let text = fs.readFileSync(path, 'utf8');
            const before = '    mockLoadMoreRouteInfo.mockResolvedValue([]);';
            const after = `    mockLoadMoreRouteInfo.mockImplementation(\n      async (_location, hospitals) => hospitals\n    );`;
            if (!text.includes(before)) throw new Error('Race test route mock anchor missing');
            text = text.replace(before, after);
            fs.writeFileSync(path, text);
          }
          NODE
      - name: Verify
        env:
          VITE_KAKAO_MAP_APP_KEY: dummy_kakao_key
          VITE_SUPABASE_ENABLED: 'false'
          VITE_ENCRYPTION_KEY: dummy_encryption_key_that_is_long_enough_for_aes_256_gcm
          EGEN_SERVICE_KEY: dummy_egen_key
          KAKAO_REST_API_KEY: dummy_kakao_rest_key
        run: |
          npm ci
          npm run test:unit
          npm run type-check
          npm run type-check:api
          npm run lint
          npm run test:api
          npm run build 2>&1 | tee build.log
          if grep -q 'INEFFECTIVE_DYNAMIC_IMPORT.*HospitalRankingService' build.log; then
            echo 'HospitalRankingService ineffective dynamic import warning still present'
            exit 1
          fi
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/pages/HomePage.tsx src/presentation/pages/HomePage.test.tsx
          git commit -m "Remove ineffective ranking dynamic import"
          git push origin HEAD:chore/remove-ineffective-ranking-import
