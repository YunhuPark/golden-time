name: Dependency Refresh

on:
  push:
    branches:
      - security/dev-dependency-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dev-dependency-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Refresh security-sensitive dev dependencies
        run: npm install --save-dev vite@8.2.2 vitest@5.0.0 @vitejs/plugin-react@6.1.1 @vercel/node@12.0.2 vercel@59.12.0
      - name: Full dependency audit report
        run: npm audit --json > audit-all.json || true
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=moderate
      - name: Environment validation tests
        run: node --test scripts/validate-env.test.cjs
      - name: Unit tests
        run: npm run test:unit
      - name: Frontend type check
        run: npm run type-check
      - name: API type check
        run: npm run type-check:api
      - name: Lint
        run: npm run lint
      - name: API tests
        run: npm run test:api
      - name: Build
        env:
          VITE_KAKAO_MAP_APP_KEY: test-kakao-map-key
          VITE_ENCRYPTION_KEY: test-encryption-key-for-ci
          EGEN_SERVICE_KEY: test-egen-service-key
          KAKAO_REST_API_KEY: test-kakao-rest-key
          VITE_SUPABASE_ENABLED: 'false'
        run: npm run build
      - name: Print dependency audit summary
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));
          console.log('all dependency vulnerabilities:', JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
      - name: Commit refreshed dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Refresh development dependencies"
          git push origin HEAD:security/dev-dependency-refresh
