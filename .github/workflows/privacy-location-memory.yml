name: Geolocation Privacy Patch

on:
  push:
    branches:
      - privacy/remove-persistent-last-location
    paths:
      - .github/workflows/privacy-location-memory.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy/remove-persistent-last-location
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Keep precise fallback location in memory only
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/presentation/hooks/useGeolocation.ts';
          let s = fs.readFileSync(path, 'utf8');

          const interfaceAnchor = `export interface GeolocationState {
  location: Coordinates | null;
  error: GeolocationError | null;
  isLoading: boolean;
  accuracy: number | null;
}`;
          const memoryState = `${interfaceAnchor}

type LastKnownLocation = {
  coords: Coordinates;
  timestamp: number;
};

let lastKnownLocation: LastKnownLocation | null = null;

function clearLegacyPersistedLocation(): void {
  try {
    localStorage.removeItem('lastKnownLocation');
  } catch {
    // Storage may be unavailable in privacy modes; there is nothing else to do.
  }
}`;
          if (!s.includes(interfaceAnchor)) throw new Error('GeolocationState anchor missing');
          s = s.replace(interfaceAnchor, memoryState);

          const persistenceBlock = `      // 위치를 localStorage에 저장 (다음 번 fallback용)
      try {
        localStorage.setItem('lastKnownLocation', JSON.stringify({
          latitude: coords.latitude,
          longitude: coords.longitude,
          accuracy: coords.accuracy,
          timestamp: Date.now(),
        }));
      } catch (e) {
        console.warn('Failed to save location to localStorage:', e);
      }`;
          const memoryBlock = `      // Keep the precise fallback only for this page session. Never persist
      // exact user coordinates to browser storage.
      lastKnownLocation = {
        coords,
        timestamp: Date.now(),
      };
      clearLegacyPersistedLocation();`;
          if (!s.includes(persistenceBlock)) throw new Error('localStorage persistence block missing');
          s = s.replace(persistenceBlock, memoryBlock);

          const docBlock = ` * 2. 타임아웃 → Last known location 또는 기본 위치 fallback
 * 3. 위치 불가 → Last known location from localStorage`;
          const newDocBlock = ` * 2. 타임아웃 → 현재 페이지 세션의 last known location 또는 기본 위치 fallback
 * 3. 위치 불가 → 메모리에만 유지한 last known location 사용`;
          if (!s.includes(docBlock)) throw new Error('geolocation docs anchor missing');
          s = s.replace(docBlock, newDocBlock);

          const oldReader = `/**
 * localStorage에서 마지막 알려진 위치 가져오기
 */
function getLastKnownLocation(): {
  coords: Coordinates;
  ageMinutes: number;
} | null {
  try {
    const stored = localStorage.getItem('lastKnownLocation');
    if (!stored) return null;

    const data = JSON.parse(stored);
    const age = Date.now() - data.timestamp;
    const ageMinutes = Math.round(age / 60000);

    // 30분 이상 지난 위치는 무시
    if (ageMinutes > 30) {
      localStorage.removeItem('lastKnownLocation');
      return null;
    }

    const coords = new Coordinates(
      data.latitude,
      data.longitude,
      data.accuracy
    );

    return { coords, ageMinutes };
  } catch (e) {
    console.warn('Failed to parse last known location:', e);
    return null;
  }
}`;
          const newReader = `/**
 * 현재 페이지 세션 메모리에서 마지막 알려진 위치 가져오기.
 * 기존 버전이 저장했을 수 있는 정확 좌표 localStorage 키는 제거합니다.
 */
function getLastKnownLocation(): {
  coords: Coordinates;
  ageMinutes: number;
} | null {
  clearLegacyPersistedLocation();
  if (!lastKnownLocation) return null;

  const age = Date.now() - lastKnownLocation.timestamp;
  const ageMinutes = Math.round(age / 60000);
  if (ageMinutes > 30) {
    lastKnownLocation = null;
    return null;
  }

  return { coords: lastKnownLocation.coords, ageMinutes };
}`;
          if (!s.includes(oldReader)) throw new Error('legacy location reader missing');
          s = s.replace(oldReader, newReader);

          fs.writeFileSync(path, s);
          NODE
      - name: Add privacy regression test
        run: |
          cat > src/presentation/hooks/useGeolocation.test.tsx <<'EOF'
          import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';
          import { renderHook, waitFor } from '@testing-library/react';
          import { useGeolocation } from './useGeolocation';

          describe('useGeolocation privacy', () => {
            const originalGeolocation = navigator.geolocation;

            beforeEach(() => {
              localStorage.clear();
            });

            afterEach(() => {
              Object.defineProperty(navigator, 'geolocation', {
                configurable: true,
                value: originalGeolocation,
              });
              vi.restoreAllMocks();
            });

            it('does not persist precise coordinates and removes the legacy location key', async () => {
              localStorage.setItem('lastKnownLocation', JSON.stringify({
                latitude: 35.123456,
                longitude: 126.987654,
                accuracy: 10,
                timestamp: Date.now(),
              }));

              Object.defineProperty(navigator, 'geolocation', {
                configurable: true,
                value: {
                  getCurrentPosition: (success: PositionCallback) => {
                    success({
                      coords: {
                        latitude: 35.145961,
                        longitude: 126.923701,
                        accuracy: 12,
                        altitude: null,
                        altitudeAccuracy: null,
                        heading: null,
                        speed: null,
                        toJSON: () => ({}),
                      },
                      timestamp: Date.now(),
                      toJSON: () => ({}),
                    } as GeolocationPosition);
                  },
                },
              });

              const setItemSpy = vi.spyOn(Storage.prototype, 'setItem');
              const { result } = renderHook(() => useGeolocation());

              await waitFor(() => expect(result.current.isLoading).toBe(false));

              expect(result.current.location?.latitude).toBe(35.145961);
              expect(result.current.location?.longitude).toBe(126.923701);
              expect(localStorage.getItem('lastKnownLocation')).toBeNull();
              expect(setItemSpy).not.toHaveBeenCalledWith('lastKnownLocation', expect.any(String));
            });
          });
          EOF
      - name: Verify
        env:
          VITE_KAKAO_MAP_APP_KEY: dummy_kakao_key
          VITE_SUPABASE_ENABLED: 'false'
          VITE_ENCRYPTION_KEY: dummy_encryption_key_that_is_long_enough_for_aes_256_gcm
          EGEN_SERVICE_KEY: dummy_egen_key
          KAKAO_REST_API_KEY: dummy_kakao_rest_key
        run: |
          npm ci
          npm run test:unit
          npm run type-check
          npm run type-check:api
          npm run lint
          npm run test:api
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/hooks/useGeolocation.ts src/presentation/hooks/useGeolocation.test.tsx
          git commit -m "Stop persisting precise geolocation fallback"
          git push origin HEAD:privacy/remove-persistent-last-location
