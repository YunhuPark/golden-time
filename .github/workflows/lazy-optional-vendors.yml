name: Lazy Optional Vendors Patch

on:
  push:
    branches:
      - performance/lazy-optional-vendors
    paths:
      - .github/workflows/lazy-optional-vendors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance/lazy-optional-vendors
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Patch optional vendor imports
        run: |
          node <<'NODE'
          const fs = require('fs');

          // Sentry startup is optional and dynamically loaded only with a DSN.
          {
            const path = 'src/main.tsx';
            let s = fs.readFileSync(path, 'utf8');
            const importLine = "import { initializeSentry } from './infrastructure/monitoring/sentry';\n";
            const initBlock = `/**\n * Initialize Sentry Error Monitoring\n */\ninitializeSentry();`;
            if (!s.includes(importLine) || !s.includes(initBlock)) throw new Error('main.tsx Sentry anchors missing');
            s = s.replace(importLine, '');
            s = s.replace(initBlock, `/**\n * Load optional monitoring only when configured.\n */\nif (import.meta.env.VITE_SENTRY_DSN) {\n  void import('./infrastructure/monitoring/sentry').then(({ initializeSentry }) => initializeSentry());\n} else {\n  console.info('ℹ️ Sentry monitoring disabled (no DSN configured)');\n}`);
            fs.writeFileSync(path, s);
          }

          // Lightweight telemetry facade: no static @sentry/react dependency.
          fs.writeFileSync('src/infrastructure/monitoring/telemetry.ts', `type ErrorContext = {\n  area?: 'geolocation' | 'api' | 'auth' | 'cache' | 'ui';\n  severity?: 'low' | 'medium' | 'high' | 'critical';\n  extra?: Record<string, unknown>;\n};\n\nconst monitoringEnabled = import.meta.env.DEV || Boolean(import.meta.env.VITE_SENTRY_DSN);\n\nexport function logError(error: Error, context?: ErrorContext): void {\n  if (!monitoringEnabled) return;\n  void import('./sentry').then(({ logError: send }) => send(error, context));\n}\n\nexport function logEvent(eventName: string, data?: Record<string, unknown>): void {\n  if (!monitoringEnabled) return;\n  void import('./sentry').then(({ logEvent: send }) => send(eventName, data));\n}\n`);

          // Auth hook loads Supabase only when the explicit capability is enabled.
          {
            const path = 'src/presentation/hooks/useAuth.ts';
            let s = fs.readFileSync(path, 'utf8');
            const imports = "import { User, Session, AuthError } from '@supabase/supabase-js';\nimport { supabase } from '../../infrastructure/supabase/supabaseClient';\n";
            if (!s.includes(imports)) throw new Error('useAuth imports missing');
            s = s.replace(imports, "import type { User, Session, AuthError } from '@supabase/supabase-js';\n");
            s = s.replace('export const useAuth = () => {', `const SUPABASE_ENABLED = import.meta.env.VITE_SUPABASE_ENABLED === 'true';\n\nasync function getSupabase() {\n  if (!SUPABASE_ENABLED) return null;\n  const { supabase } = await import('../../infrastructure/supabase/supabaseClient');\n  return supabase;\n}\n\nexport const useAuth = () => {`);
            const effectBefore = `    // 초기 세션 확인 (비동기, 논블로킹)\n    // requestIdleCallback을 사용하여 메인 스레드가 여유로울 때 실행\n    const idleCallback = window.requestIdleCallback\n      ? window.requestIdleCallback(() => {\n          supabase.auth.getSession().then(({ data: { session } }) => {\n            setSession(session);\n            setUser(session?.user ?? null);\n          });\n        })\n      : setTimeout(() => {\n          supabase.auth.getSession().then(({ data: { session } }) => {\n            setSession(session);\n            setUser(session?.user ?? null);\n          });\n        }, 0);\n\n    // 인증 상태 변경 감지\n    const {\n      data: { subscription },\n    } = supabase.auth.onAuthStateChange((_event, session) => {\n      setSession(session);\n      setUser(session?.user ?? null);\n    });\n\n    return () => {\n      subscription.unsubscribe();\n      if ('cancelIdleCallback' in window && typeof idleCallback === 'number') {\n        (window as any).cancelIdleCallback(idleCallback);\n      } else if (typeof idleCallback === 'number') {\n        clearTimeout(idleCallback);\n      }\n    };`;
            const effectAfter = `    if (!SUPABASE_ENABLED) return;\n\n    let disposed = false;\n    let unsubscribe: (() => void) | undefined;\n    const loadSession = async () => {\n      const supabase = await getSupabase();\n      if (!supabase || disposed) return;\n      const { data: { session } } = await supabase.auth.getSession();\n      if (!disposed) {\n        setSession(session);\n        setUser(session?.user ?? null);\n      }\n      const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, nextSession) => {\n        if (disposed) return;\n        setSession(nextSession);\n        setUser(nextSession?.user ?? null);\n      });\n      unsubscribe = () => subscription.unsubscribe();\n    };\n\n    const idleCallback = window.requestIdleCallback\n      ? window.requestIdleCallback(() => { void loadSession(); })\n      : setTimeout(() => { void loadSession(); }, 0);\n\n    return () => {\n      disposed = true;\n      unsubscribe?.();\n      if ('cancelIdleCallback' in window && typeof idleCallback === 'number') {\n        window.cancelIdleCallback(idleCallback);\n      } else if (typeof idleCallback === 'number') {\n        clearTimeout(idleCallback);\n      }\n    };`;
            if (!s.includes(effectBefore)) throw new Error('useAuth effect anchor missing');
            s = s.replace(effectBefore, effectAfter);
            const replacements = [
              ["    const { error } = await supabase.auth.signInWithPassword({", "    const supabase = await getSupabase();\n    if (!supabase) return { error: new Error('Supabase disabled') as AuthError };\n    const { error } = await supabase.auth.signInWithPassword({"],
              ["    const { error } = await supabase.auth.signUp({", "    const supabase = await getSupabase();\n    if (!supabase) return { error: new Error('Supabase disabled') as AuthError };\n    const { error } = await supabase.auth.signUp({"],
              ["    const { error } = await supabase.auth.signInWithOAuth({", "    const supabase = await getSupabase();\n    if (!supabase) return { error: new Error('Supabase disabled') as AuthError };\n    const { error } = await supabase.auth.signInWithOAuth({"],
              ["    const { error } = await supabase.auth.signOut();", "    const supabase = await getSupabase();\n    if (!supabase) return { error: null };\n    const { error } = await supabase.auth.signOut();"],
              ["    const { error } = await supabase.auth.resetPasswordForEmail(email, {", "    const supabase = await getSupabase();\n    if (!supabase) return { error: new Error('Supabase disabled') as AuthError };\n    const { error } = await supabase.auth.resetPasswordForEmail(email, {"]
            ];
            for (const [before, after] of replacements) {
              if (!s.includes(before)) throw new Error(`useAuth anchor missing: ${before}`);
              s = s.replace(before, after);
            }
            fs.writeFileSync(path, s);
          }

          // HomePage defers account-heavy views and its direct favorites query.
          {
            const path = 'src/presentation/pages/HomePage.tsx';
            let s = fs.readFileSync(path, 'utf8');
            const telemetryImport = "import { logError, logEvent } from '../../infrastructure/monitoring/sentry';";
            const supabaseImport = "import { supabase } from '../../infrastructure/supabase/supabaseClient';\n";
            const detailImport = "import { HospitalDetailModal } from '../components/hospital/HospitalDetailModal';\n";
            const profileImport = "import { ProfilePage } from './ProfilePage';\n";
            if (!s.includes(telemetryImport) || !s.includes(supabaseImport) || !s.includes(detailImport) || !s.includes(profileImport)) throw new Error('HomePage import anchor missing');
            s = s.replace(telemetryImport, "import { logError, logEvent } from '../../infrastructure/monitoring/telemetry';");
            s = s.replace(supabaseImport, '');
            s = s.replace(detailImport, "const HospitalDetailModal = React.lazy(() => import('../components/hospital/HospitalDetailModal').then((m) => ({ default: m.HospitalDetailModal })));\n");
            s = s.replace(profileImport, "const ProfilePage = React.lazy(() => import('./ProfilePage').then((m) => ({ default: m.ProfilePage })));\n");
            const favoritesBefore = `        const { data, error: fetchError } = await supabase\n          .from('favorites')`;
            const favoritesAfter = `        if (import.meta.env.VITE_SUPABASE_ENABLED !== 'true') return;\n        const { supabase } = await import('../../infrastructure/supabase/supabaseClient');\n        const { data, error: fetchError } = await supabase\n          .from('favorites')`;
            if (!s.includes(favoritesBefore)) throw new Error('HomePage favorites anchor missing');
            s = s.replace(favoritesBefore, favoritesAfter);
            fs.writeFileSync(path, s);
          }

          // HospitalCard stays in the fast path, but optional account data is loaded on demand.
          {
            const path = 'src/presentation/components/hospital/HospitalCard.tsx';
            let s = fs.readFileSync(path, 'utf8');
            for (const line of [
              "import { supabase } from '../../../infrastructure/supabase/supabaseClient';\n",
              "import { VisitHistoryService } from '../../../domain/services/VisitHistoryService';\n",
              "import { ReviewService } from '../../../domain/services/ReviewService';\n",
              "import { useAuthSession } from '../../hooks/useAuthSession';\n"
            ]) {
              if (!s.includes(line)) throw new Error(`HospitalCard import missing: ${line}`);
              s = s.replace(line, '');
            }
            s = s.replace("import { logError } from '../../../infrastructure/monitoring/sentry';", "import { logError } from '../../../infrastructure/monitoring/telemetry';");
            s = s.replace('  const { handleSessionError } = useAuthSession();\n', '');
            s = s.replace("  const geofenceActivatedRef = React.useRef(false);", `  const geofenceActivatedRef = React.useRef(false);\n  const supabaseEnabled = import.meta.env.VITE_SUPABASE_ENABLED === 'true';\n\n  const isSessionExpiredError = (error: unknown): boolean => {\n    if (!error || typeof error !== 'object') return false;\n    const candidate = error as { message?: string; status?: number; code?: string };\n    const message = candidate.message ?? String(error);\n    return /jwt|token|expired|unauthorized|not authenticated/i.test(message) || candidate.status === 401 || candidate.code === 'PGRST301';\n  };`);
            s = s.replace("      if (!user) {\n        setIsFavorite(false);\n        return;\n      }\n      try {\n        const { data, error } = await supabase", "      if (!user || !supabaseEnabled) {\n        setIsFavorite(false);\n        return;\n      }\n      try {\n        const { supabase } = await import('../../../infrastructure/supabase/supabaseClient');\n        const { data, error } = await supabase");
            s = s.replace("    const loadRating = async () => {\n      try {\n        const result = await ReviewService.getHospitalRatingStats(hospital.id);", "    const loadRating = async () => {\n      if (!supabaseEnabled) return;\n      try {\n        const { ReviewService } = await import('../../../domain/services/ReviewService');\n        const result = await ReviewService.getHospitalRatingStats(hospital.id);");
            s = s.replace("    if (!user) return;\n    try {\n      const { success, error } = await VisitHistoryService.addVisit({", "    if (!user || !supabaseEnabled) return;\n    try {\n      const { VisitHistoryService } = await import('../../../domain/services/VisitHistoryService');\n      const { success, error } = await VisitHistoryService.addVisit({");
            s = s.replace("    setFavoriteLoading(true);\n    try {\n      if (isFavorite) {", "    if (!supabaseEnabled) {\n      openLoginModal('즐겨찾기');\n      return;\n    }\n    setFavoriteLoading(true);\n    try {\n      const { supabase } = await import('../../../infrastructure/supabase/supabaseClient');\n      if (isFavorite) {");
            s = s.replace("      if (handleSessionError(error)) {", "      if (isSessionExpiredError(error)) {");
            fs.writeFileSync(path, s);
          }

          // Map errors use the lightweight telemetry facade.
          {
            const path = 'src/presentation/components/map/KakaoMap.tsx';
            let s = fs.readFileSync(path, 'utf8');
            const before = "import { logError } from '../../../infrastructure/monitoring/sentry';";
            if (!s.includes(before)) throw new Error('KakaoMap Sentry import missing');
            s = s.replace(before, "import { logError } from '../../../infrastructure/monitoring/telemetry';");
            fs.writeFileSync(path, s);
          }
          NODE
      - name: Verify tests build and preload graph
        env:
          VITE_KAKAO_MAP_APP_KEY: test-kakao-map-key
          VITE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          EGEN_SERVICE_KEY: test-egen-service-key
          KAKAO_REST_API_KEY: test-kakao-rest-key
          VITE_SUPABASE_ENABLED: 'false'
          VITE_SENTRY_DSN: ''
        run: |
          npm ci
          npm run test:unit
          npm run type-check
          npm run type-check:api
          npm run lint
          npm run test:api
          npm run build
          if grep -q 'vendor-supabase' dist/index.html; then echo 'Supabase still preloaded' && exit 1; fi
          if grep -q 'vendor-sentry' dist/index.html; then echo 'Sentry still preloaded' && exit 1; fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/infrastructure/monitoring/telemetry.ts src/presentation/hooks/useAuth.ts src/presentation/pages/HomePage.tsx src/presentation/components/hospital/HospitalCard.tsx src/presentation/components/map/KakaoMap.tsx
          git commit -m "Lazy load optional Supabase and Sentry vendors"
          git push origin HEAD:performance/lazy-optional-vendors
