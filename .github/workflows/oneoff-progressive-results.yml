name: One-off progressive results patch

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/progressive-hospital-results

      - name: Make hospital results progressive
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/presentation/pages/HomePage.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """        // 초기 랭킹은 화면에 바로 노출하지 않습니다.\n        // 상위 후보의 실제 경로시간 계산 후 최종 랭킹을 한 번만 표시합니다.\n        console.log(`✅ Loaded ${result.hospitals.length} hospitals from API; final ranking pending route info`);\n""",
                  """        // E-Gen/지오코딩 결과는 이미 AI/응급도 기준으로 1차 랭킹되어 있습니다.\n        // 실제 도로 경로 계산은 느릴 수 있으므로 병원 목록을 즉시 노출하고,\n        // 상위 후보의 경로시간만 백그라운드에서 보강한 뒤 최종 랭킹을 갱신합니다.\n        setHospitals(result.hospitals, result.warning);\n        console.log(`✅ Showing ${result.hospitals.length} hospitals immediately; enriching top 10 route info in background`);\n""",
              ),
              (
                  """        // 최종 후보가 확정될 때까지 로딩 상태를 유지해 중간 순위가 깜빡이지 않게 합니다.\n        await (async () => {\n""",
                  """        // 경로 계산은 초기 결과 렌더링을 막지 않습니다.\n        void (async () => {\n""",
              ),
              (
                  """              // 경로 계산 실패 시에만 1차 랭킹을 fallback으로 표시합니다.\n              setHospitals(result.hospitals, result.warning);\n              setRouteCalcStatus(prev => {\n""",
                  """              // 초기 병원 목록은 이미 노출되어 있으므로 유지하고 경로 상태만 실패로 표시합니다.\n              setRouteCalcStatus(prev => {\n""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit performance change to branch
        shell: bash
        run: |
          if git diff --quiet -- src/presentation/pages/HomePage.tsx; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/pages/HomePage.tsx
          git commit -m "Render hospital results before route enrichment"
          git push origin HEAD:perf/progressive-hospital-results
