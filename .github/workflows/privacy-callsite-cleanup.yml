name: Privacy Callsite Cleanup

on:
  push:
    branches:
      - privacy/remove-location-from-error-context
    paths:
      - .github/workflows/privacy-callsite-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy/remove-location-from-error-context
      - name: Update HomePage privacy callsites
        shell: bash
        run: |
          perl -0pi -e "s/HospitalCache\.save\(result\.hospitals, userLocation, '서울특별시'\); \/\/ TODO: 실제 지역 추론/HospitalCache.save(result.hospitals, userLocation);/g" src/presentation/pages/HomePage.tsx
          perl -0pi -e "s/\n          extra: \{\n            location: \{\n              lat: userLocation\.latitude,\n              lon: userLocation\.longitude,\n            \},\n          \},//g" src/presentation/pages/HomePage.tsx
          grep -F "HospitalCache.save(result.hospitals, userLocation);" src/presentation/pages/HomePage.tsx
          if grep -F "lat: userLocation.latitude" src/presentation/pages/HomePage.tsx; then exit 1; fi
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/pages/HomePage.tsx
          git commit -m "Stop attaching precise location to API error telemetry"
          git push origin HEAD:privacy/remove-location-from-error-context
