name: Hook Dependency Cleanup

on:
  push:
    branches:
      - fix/react-hook-dependencies
    paths:
      - .github/workflows/fix-hook-deps.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/react-hook-dependencies
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Patch hook dependencies
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replace(path, before, after) {
            let s = fs.readFileSync(path, 'utf8');
            if (!s.includes(before)) throw new Error(`${path}: anchor missing`);
            s = s.replace(before, after);
            fs.writeFileSync(path, s);
          }

          replace(
            'src/presentation/components/hospital/HospitalCard.tsx',
            '  }, [user, hospital.id]);',
            '  }, [user, hospital.id, supabaseEnabled]);'
          );
          replace(
            'src/presentation/components/hospital/HospitalCard.tsx',
            '  }, [hospital.id]);',
            '  }, [hospital.id, supabaseEnabled]);'
          );

          replace(
            'src/presentation/components/map/KakaoMap.tsx',
            '  }, []); // 최초 1회만 실행',
            '  }, [userLocation?.latitude, userLocation?.longitude]);'
          );

          {
            const path = 'src/presentation/components/profile/MyReviewsList.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace("import React, { useState, useEffect } from 'react';", "import React, { useState, useEffect, useCallback } from 'react';");
            s = s.replace('  const loadMyReviews = async () => {', '  const loadMyReviews = useCallback(async () => {');
            s = s.replace('  };\n\n  useEffect(() => {\n    loadMyReviews();\n  }, [user]);', '  }, [user]);\n\n  useEffect(() => {\n    void loadMyReviews();\n  }, [loadMyReviews]);');
            fs.writeFileSync(path, s);
          }

          {
            const path = 'src/presentation/components/review/ReviewList.tsx';
            let s = fs.readFileSync(path, 'utf8');
            s = s.replace("import React, { useState, useEffect } from 'react';", "import React, { useState, useEffect, useCallback } from 'react';");
            s = s.replace('  const loadReviews = async () => {', '  const loadReviews = useCallback(async () => {');
            s = s.replace('  };\n\n  useEffect(() => {\n    loadReviews();\n  }, [hospitalId, user]);', '  }, [hospitalId, user]);\n\n  useEffect(() => {\n    void loadReviews();\n  }, [loadReviews]);');
            fs.writeFileSync(path, s);
          }

          {
            const path = 'src/presentation/hooks/useGeolocation.ts';
            let s = fs.readFileSync(path, 'utf8');
            const signature = `export function useGeolocation(\n  options: PositionOptions = {\n    enableHighAccuracy: true,\n    timeout: 10000, // 10초 (응급상황 고려)\n    maximumAge: 30000, // 30초간 캐시 허용\n  }\n): GeolocationState {`;
            const replacement = `${signature}\n  const { enableHighAccuracy, timeout, maximumAge } = options;`;
            if (!s.includes(signature)) throw new Error('useGeolocation signature missing');
            s = s.replace(signature, replacement);
            s = s.replace('{ ...options, timeout: timeoutDuration }', '{ enableHighAccuracy, maximumAge, timeout: timeoutDuration }');
            s = s.replace('  }, [options.enableHighAccuracy, options.timeout, options.maximumAge]);', '  }, [enableHighAccuracy, timeout, maximumAge]);');
            fs.writeFileSync(path, s);
          }
          NODE
      - name: Verify
        env:
          VITE_KAKAO_MAP_APP_KEY: dummy_kakao_key
          VITE_SUPABASE_ENABLED: 'false'
          VITE_ENCRYPTION_KEY: dummy_encryption_key_that_is_long_enough_for_aes_256_gcm
          EGEN_SERVICE_KEY: dummy_egen_key
          KAKAO_REST_API_KEY: dummy_kakao_rest_key
        run: |
          npm ci
          npm run test:unit
          npm run type-check
          npm run type-check:api
          npm run lint | tee lint.log
          if grep -q 'react-hooks/exhaustive-deps' lint.log; then echo 'Hook dependency warnings remain' && exit 1; fi
          npm run test:api
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/components/hospital/HospitalCard.tsx src/presentation/components/map/KakaoMap.tsx src/presentation/components/profile/MyReviewsList.tsx src/presentation/components/review/ReviewList.tsx src/presentation/hooks/useGeolocation.ts
          git commit -m "Fix React hook dependency warnings"
          git push origin HEAD:fix/react-hook-dependencies
