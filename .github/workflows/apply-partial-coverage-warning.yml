name: Apply partial coverage warning

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch partial coverage warning flow
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/domain/repositories/IHospitalRepository.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "    aiContext?: AIAnalysisContext | null,\n    onInitialResults?: (hospitals: Hospital[]) => void\n  ): Promise<Hospital[]>;",
              "    aiContext?: AIAnalysisContext | null,\n    onInitialResults?: (hospitals: Hospital[]) => void,\n    onCoverageWarning?: (failedRegions: string[], discoveryFailed: boolean) => void\n  ): Promise<Hospital[]>;"
          )
          s = s.replace(
              "   * @param onInitialResults 현재 지역의 초기 병원 결과 콜백 (선택사항)\n",
              "   * @param onInitialResults 현재 지역의 초기 병원 결과 콜백 (선택사항)\n   * @param onCoverageWarning 일부 지역 또는 인접지역 탐색 실패 알림 콜백 (선택사항)\n"
          )
          p.write_text(s, encoding='utf-8')

          p = Path('src/data/repositories/HospitalRepositoryImpl.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "    aiContext?: AIAnalysisContext | null,\n    onInitialResults?: (hospitals: Hospital[]) => void\n  ): Promise<Hospital[]> {",
              "    aiContext?: AIAnalysisContext | null,\n    onInitialResults?: (hospitals: Hospital[]) => void,\n    onCoverageWarning?: (failedRegions: string[], discoveryFailed: boolean) => void\n  ): Promise<Hospital[]> {"
          )
          s = s.replace(
              "      const discoveredRegions = new Set<string>([currentRegion]);\n      try {",
              "      const discoveredRegions = new Set<string>([currentRegion]);\n      let discoveryFailed = false;\n      try {"
          )
          s = s.replace(
              "      } catch (error) {\n        console.warn(\n          '⚠️ Coordinate-based E-Gen discovery unavailable; using the current region only',",
              "      } catch (error) {\n        discoveryFailed = true;\n        console.warn(\n          '⚠️ Coordinate-based E-Gen discovery unavailable; using the current region only',"
          )
          needle = "      const successfulRegionCount = (currentRegionError ? 0 : 1) + successfulNeighborCount;\n      console.log("
          insert = "      const failedRegions: string[] = [];\n      if (currentRegionError) failedRegions.push(currentRegion);\n      neighborResults.forEach((result, index) => {\n        if (result.status === 'rejected') failedRegions.push(neighboringRegions[index]);\n      });\n      if ((failedRegions.length > 0 || discoveryFailed) && onCoverageWarning) {\n        onCoverageWarning(failedRegions, discoveryFailed);\n      }\n\n      const successfulRegionCount = (currentRegionError ? 0 : 1) + successfulNeighborCount;\n      console.log("
          if needle not in s:
              raise SystemExit('repository insertion point not found')
          s = s.replace(needle, insert, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/domain/usecases/GetNearbyHospitals.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "  type: 'NO_HOSPITALS_FOUND' | 'NO_BEDS_AVAILABLE' | 'DATA_STALE' | 'LOW_ACCURACY' | 'NETWORK_ERROR';",
              "  type: 'NO_HOSPITALS_FOUND' | 'NO_BEDS_AVAILABLE' | 'DATA_STALE' | 'LOW_ACCURACY' | 'NETWORK_ERROR' | 'PARTIAL_COVERAGE';"
          )
          s = s.replace(
              "    const performanceSearchId = startHospitalSearchPerformance();\n\n    try {",
              "    const performanceSearchId = startHospitalSearchPerformance();\n    let coverageWarning: HospitalSearchWarning | null = null;\n\n    try {"
          )
          s = s.replace(
              "          }\n        }\n      );",
              "          }\n        },\n        (failedRegions, discoveryFailed) => {\n          const details: string[] = [];\n          if (failedRegions.length > 0) details.push(`${failedRegions.join(', ')} 실시간 조회`);\n          if (discoveryFailed) details.push('인접 지역 탐색');\n          coverageWarning = {\n            type: 'PARTIAL_COVERAGE',\n            message: `일부 검색 범위를 불러오지 못했습니다${details.length ? ` (${details.join(' · ')})` : ''}. 표시된 병원 정보는 확인 가능하지만, 더 가까운 응급실이 누락될 수 있습니다.`,\n            action: { type: 'REFRESH_DATA', label: '다시 검색' },\n          };\n        }\n      );"
          )
          s = s.replace(
              "      const warning: HospitalSearchWarning | null = hasStaleData\n        ? {",
              "      const warning: HospitalSearchWarning | null = coverageWarning ?? (hasStaleData\n        ? {"
          )
          s = s.replace(
              "        : null;\n\n      const topHospitals = availableHospitals;",
              "        : null);\n\n      const topHospitals = availableHospitals;"
          )
          p.write_text(s, encoding='utf-8')

          p = Path('src/presentation/components/hospital/HospitalList.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "        case 'DATA_STALE':\n          return { bgColor: '#FF9500', textColor: '#fff' };",
              "        case 'DATA_STALE':\n        case 'PARTIAL_COVERAGE':\n          return { bgColor: '#FF9500', textColor: '#fff' };"
          )
          p.write_text(s, encoding='utf-8')

          Path('src/domain/usecases/GetNearbyHospitals.coverage.test.ts').write_text(r'''import { describe, expect, it, vi } from 'vitest';
import { Coordinates } from '../valueObjects/Coordinates';
import { Hospital } from '../entities/Hospital';
import { IHospitalRepository } from '../repositories/IHospitalRepository';
import { GetNearbyHospitals } from './GetNearbyHospitals';

function hospital(): Hospital {
  return new Hospital(
    'H1',
    '테스트 응급실',
    new Coordinates(37.5, 127),
    '서울특별시 테스트로 1',
    '02-0000-0000',
    null,
    2,
    10,
    ['응급의학과'],
    3,
    true,
    new Date(),
    true,
    true,
    true,
    5,
    undefined,
    undefined,
    1,
    0
  );
}

describe('GetNearbyHospitals partial coverage warning', () => {
  it('returns a non-blocking warning when one regional query fails', async () => {
    const repository: IHospitalRepository = {
      findNearby: vi.fn(async (_coords, _ctx, onInitial, onCoverageWarning) => {
        const hospitals = [hospital()];
        onInitial?.(hospitals);
        onCoverageWarning?.(['경기도'], false);
        return hospitals;
      }),
      findByRegion: vi.fn(),
      findById: vi.fn(),
    };

    const result = await new GetNearbyHospitals(repository).execute(new Coordinates(37.5665, 126.978));
    expect(result.hospitals).toHaveLength(1);
    expect(result.warning?.type).toBe('PARTIAL_COVERAGE');
    expect(result.warning?.message).toContain('경기도');
  });

  it('warns when coordinate discovery fails even if the current region succeeds', async () => {
    const repository: IHospitalRepository = {
      findNearby: vi.fn(async (_coords, _ctx, _onInitial, onCoverageWarning) => {
        onCoverageWarning?.([], true);
        return [hospital()];
      }),
      findByRegion: vi.fn(),
      findById: vi.fn(),
    };

    const result = await new GetNearbyHospitals(repository).execute(new Coordinates(37.5665, 126.978));
    expect(result.warning?.type).toBe('PARTIAL_COVERAGE');
    expect(result.warning?.message).toContain('인접 지역 탐색');
  });
});
''', encoding='utf-8')
          PY

          git rm .github/workflows/apply-partial-coverage-warning.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/apply-partial-coverage-warning.yml
          git commit -m "fix: surface partial nationwide search coverage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
