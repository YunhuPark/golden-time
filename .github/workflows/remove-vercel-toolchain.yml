name: Remove Vulnerable Vercel Toolchain

on:
  push:
    branches:
      - security/remove-vulnerable-vercel-toolchain

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-vulnerable-vercel-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Remove vulnerable Vercel development toolchain
        run: |
          npm uninstall --save-dev vercel @vercel/node
          npm pkg set scripts.dev="vite"
      - name: Full dependency audit
        run: npm audit --json > audit-all.json || true
      - name: Print audit summary
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-all.json', 'utf8'));
          console.log(JSON.stringify(audit.metadata?.vulnerabilities || {}));
          NODE
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=moderate
      - name: Environment validation tests
        run: node --test scripts/validate-env.test.cjs
      - name: Unit tests
        run: npm run test:unit
      - name: Frontend type check
        run: npm run type-check
      - name: API type check
        run: npm run type-check:api
      - name: Lint
        run: npm run lint
      - name: API tests
        run: npm run test:api
      - name: Build
        env:
          VITE_KAKAO_MAP_APP_KEY: dummy_kakao_key
          VITE_SUPABASE_ENABLED: 'false'
          VITE_ENCRYPTION_KEY: dummy_encryption_key_that_is_long_enough_for_aes_256_gcm
          EGEN_SERVICE_KEY: dummy_egen_key
          KAKAO_REST_API_KEY: dummy_kakao_rest_key
        run: npm run build
      - name: Commit package cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Remove vulnerable Vercel development toolchain"
          git push origin HEAD:security/remove-vulnerable-vercel-toolchain
