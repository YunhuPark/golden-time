name: Production GPS audit

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Probe live E-Gen first-level region aliases
        env:
          BASE_URL: https://golden-time.vercel.app
        run: |
          node <<'NODE'
          const endpoint = '/ErmctInfoInqireService/getEmrrmRltmUsefulSckbdInfoInqire';
          const groups = [
            ['서울특별시','서울'], ['인천광역시','인천'], ['부산광역시','부산'], ['대구광역시','대구'],
            ['광주광역시','광주'], ['대전광역시','대전'], ['울산광역시','울산'], ['세종특별자치시','세종'],
            ['경기도','경기'], ['경상남도','경남'], ['경상북도','경북'], ['전라남도','전남'],
            ['전북특별자치도','전라북도','전북'], ['충청남도','충남'], ['충청북도','충북'],
            ['강원특별자치도','강원도','강원'], ['제주특별자치도','제주']
          ];
          function itemsOf(json) {
            const item = json?.response?.body?.items?.item;
            return !item ? [] : Array.isArray(item) ? item : [item];
          }
          async function probe(stage1) {
            const qs = new URLSearchParams({_endpoint:endpoint,STAGE1:stage1,numOfRows:'300',pageNo:'1',_type:'json'});
            const res = await fetch(`${process.env.BASE_URL}/api/egen?${qs}`);
            const json = await res.json();
            const items = itemsOf(json);
            return {stage1,status:res.status,totalCount:json?.response?.body?.totalCount,count:items.length,sample:items.slice(0,2).map(x=>x.dutyName)};
          }
          (async()=>{
            const output=[];
            for(const group of groups){
              const results=[];
              for(const stage1 of group){
                try{results.push(await probe(stage1));}catch(error){results.push({stage1,error:String(error)});}
              }
              output.push(results);
            }
            console.log('EGEN_ALL_REGION_PROBE='+JSON.stringify(output));
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
