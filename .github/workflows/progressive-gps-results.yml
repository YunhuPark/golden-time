name: Progressive GPS results

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply progressive search patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
            if old not in text:
              raise SystemExit(f'{label} not found')
            return text.replace(old, new, 1)

          p = Path('src/domain/repositories/IHospitalRepository.ts')
          s = p.read_text()
          s = must_replace(
            s,
            '  findNearby(coords: Coordinates, aiContext?: AIAnalysisContext | null): Promise<Hospital[]>;',
            '  findNearby(\n    coords: Coordinates,\n    aiContext?: AIAnalysisContext | null,\n    onInitialResults?: (hospitals: Hospital[]) => void\n  ): Promise<Hospital[]>;',
            'repository interface'
          )
          p.write_text(s)

          p = Path('src/domain/usecases/GetNearbyHospitals.ts')
          s = p.read_text()
          s = must_replace(
            s,
            '    aiContext?: AIAnalysisContext | null\n  ): Promise<HospitalSearchResult> {',
            '    aiContext?: AIAnalysisContext | null,\n    onInitialResults?: (hospitals: Hospital[]) => void\n  ): Promise<HospitalSearchResult> {',
            'usecase signature'
          )
          s = must_replace(
            s,
            '      const allHospitals = await this.hospitalRepository.findNearby(userLocation, aiContext);',
            '      const allHospitals = await this.hospitalRepository.findNearby(userLocation, aiContext, onInitialResults);',
            'usecase repository call'
          )
          p.write_text(s)

          p = Path('src/data/repositories/HospitalRepositoryImpl.ts')
          s = p.read_text()
          s = must_replace(
            s,
            '  async findNearby(coords: Coordinates, aiContext?: AIAnalysisContext | null): Promise<Hospital[]> {',
            '  async findNearby(\n    coords: Coordinates,\n    aiContext?: AIAnalysisContext | null,\n    onInitialResults?: (hospitals: Hospital[]) => void\n  ): Promise<Hospital[]> {',
            'repository signature'
          )

          old = '''      // Use E-Gen's coordinate endpoint as the discovery surface. It already
      // returns nearby emergency institutions in distance order, so we only fan
      // out realtime/basic-info calls to regions actually represented near the
      // user instead of querying every region whose coarse bounds intersect a
      // 100km circle.
      const discoveredRegions = new Set<string>([currentRegion]);
      try {
        const nearbyLocations = await this.apiClient.getNearbyEmergencyLocations(
          coords.latitude,
          coords.longitude,
          100
        );

        for (const location of nearbyLocations) {
          const latitude = Number(location.latitude ?? location.wgs84Lat);
          const longitude = Number(location.longitude ?? location.wgs84Lon);
          if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) continue;

          const hospitalCoords = new Coordinates(latitude, longitude);
          const distanceKm = hospitalCoords.distanceTo(coords) / 1000;
          if (distanceKm > MAX_DISTANCE_KM) continue;

          const region = inferRegionFromHospitalLocation(location.dutyAddr, hospitalCoords);
          if (region) discoveredRegions.add(region);
        }
      } catch (error) {
        console.warn(
          '⚠️ Coordinate-based E-Gen discovery unavailable; falling back to the current region only',
          error
        );
      }

      const regions = Array.from(discoveredRegions);
      console.log(`🏥 GPS scoped search regions (${regions.length}): ${regions.join(', ')}`);

      const regionResults = await Promise.allSettled(
        regions.map((region) => this.apiClient.getCombinedHospitalData(region))
      );
'''
          new = '''      // Start current-region data and coordinate discovery together. The current
      // region can paint first while discovery determines which neighboring
      // E-Gen regions are actually represented inside the 100km GPS radius.
      const currentRegionRequest = this.apiClient.getCombinedHospitalData(currentRegion);
      const discoveredRegionsPromise = (async () => {
        const discoveredRegions = new Set<string>([currentRegion]);
        try {
          const nearbyLocations = await this.apiClient.getNearbyEmergencyLocations(
            coords.latitude,
            coords.longitude,
            100
          );

          for (const location of nearbyLocations) {
            const latitude = Number(location.latitude ?? location.wgs84Lat);
            const longitude = Number(location.longitude ?? location.wgs84Lon);
            if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) continue;

            const hospitalCoords = new Coordinates(latitude, longitude);
            const distanceKm = hospitalCoords.distanceTo(coords) / 1000;
            if (distanceKm > MAX_DISTANCE_KM) continue;

            const region = inferRegionFromHospitalLocation(location.dutyAddr, hospitalCoords);
            if (region) discoveredRegions.add(region);
          }
        } catch (error) {
          console.warn(
            '⚠️ Coordinate-based E-Gen discovery unavailable; falling back to the current region only',
            error
          );
        }
        return Array.from(discoveredRegions);
      })();

      let currentRegionData: Awaited<ReturnType<EGenApiClient['getCombinedHospitalData']>> | null = null;
      try {
        currentRegionData = await currentRegionRequest;
        const currentHospitals = HospitalMapper.toDomainList(currentRegionData)
          .filter((hospital) => hospital.coordinates && hospital.distanceFrom(coords) / 1000 <= MAX_DISTANCE_KM);
        const initialRanked = HospitalRankingService.rankHospitals(currentHospitals, aiContext);
        if (initialRanked.length > 0) {
          console.log(`⚡ Initial GPS results: ${initialRanked.length} hospitals from ${currentRegion}`);
          onInitialResults?.(initialRanked);
        }
      } catch (error) {
        console.warn(`⚠️ Current-region E-Gen search failed for ${currentRegion}; waiting for neighboring regions`, error);
      }

      const regions = await discoveredRegionsPromise;
      console.log(`🏥 GPS scoped search regions (${regions.length}): ${regions.join(', ')}`);

      const regionRequests = regions.map((region) =>
        region === currentRegion
          ? (currentRegionData ? Promise.resolve(currentRegionData) : currentRegionRequest)
          : this.apiClient.getCombinedHospitalData(region)
      );
      const regionResults = await Promise.allSettled(regionRequests);
'''
          s = must_replace(s, old, new, 'coordinate discovery block')
          p.write_text(s)

          p = Path('src/presentation/pages/HomePage.tsx')
          s = p.read_text()
          s = must_replace(
            s,
            '        const result = await useCase.execute(userLocation, aiContext);',
            '''        const result = await useCase.execute(userLocation, aiContext, (initialHospitals) => {
          if (isCancelled || initialHospitals.length === 0) return;
          setHospitals(initialHospitals, {
            type: 'DATA_STALE',
            message: '현재 지역 응급실을 먼저 표시했습니다. 인접 지역 결과를 확인하는 중입니다.',
          });
          console.log(`⚡ Showing ${initialHospitals.length} current-region hospitals while neighboring regions load`);
        });''',
            'homepage execute call'
          )
          p.write_text(s)

          # Keep this PR focused on behavior and let the repository's full CI
          # validate existing + new type contracts. Remove the temporary mutator.
          Path('.github/workflows/progressive-gps-results.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: stream current-region ER results first"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
