name: Apply final triage UX fix

on:
  push:
    branches:
      - fix/triage-hospital-differentiation
    paths:
      - .github/workflows/apply-final-triage-ux-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/triage-hospital-differentiation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_final_triage_ux_fix.py
      - run: git rm scripts/apply_final_triage_ux_fix.py .github/workflows/apply-final-triage-ux-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent preliminary hospital ranking flash"
          git push origin HEAD:fix/triage-hospital-differentiation
