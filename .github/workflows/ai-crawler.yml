name: Daily AI Hospital Crawler

on:
  schedule:
    # 매일 자정 (KST 기준 오전 9시)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Check Secrets
        env:
          EGEN_SERVICE_KEY: ${{ secrets.EGEN_SERVICE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "$EGEN_SERVICE_KEY" ]; then missing+=("EGEN_SERVICE_KEY"); fi
          if [ -z "$VITE_SUPABASE_URL" ]; then missing+=("VITE_SUPABASE_URL"); fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing+=("SUPABASE_SERVICE_ROLE_KEY"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run AI Crawler Script
        env:
          EGEN_SERVICE_KEY: ${{ secrets.EGEN_SERVICE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CRAWLER_TEST_LIMIT: 0
        run: npm run crawler
