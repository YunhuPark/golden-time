name: Daily AI Hospital Crawler

# The crawler is temporarily manual-only while the optional Supabase backend is
# unavailable. Core E-Gen hospital search does not depend on this workflow.
# Re-enable the schedule after a live Supabase project and fresh credentials are
# configured and a manual run completes successfully.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-crawler-group
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Secrets
        env:
          EGEN_SERVICE_KEY: ${{ secrets.EGEN_SERVICE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "$EGEN_SERVICE_KEY" ]; then missing+=("EGEN_SERVICE_KEY"); fi
          if [ -z "$VITE_SUPABASE_URL" ]; then missing+=("VITE_SUPABASE_URL"); fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing+=("SUPABASE_SERVICE_ROLE_KEY"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "❌ Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run AI Crawler Script
        env:
          EGEN_SERVICE_KEY: ${{ secrets.EGEN_SERVICE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CRAWLER_TEST_LIMIT: 5
        run: npm run crawler
