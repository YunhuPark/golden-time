name: Daily AI Hospital Crawler

# The crawler is temporarily manual-only while the optional Supabase backend is
# unavailable. Core E-Gen hospital search does not depend on this workflow.
# Re-enable the schedule after a live Supabase project and fresh credentials are
# configured and a manual run completes successfully.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Crawler Script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EGEN_SERVICE_KEY: ${{ secrets.EGEN_SERVICE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CRAWLER_TEST_LIMIT: 5
        run: npm run crawler
