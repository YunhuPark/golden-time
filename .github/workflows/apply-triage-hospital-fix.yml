name: Apply triage hospital fix

on:
  push:
    branches:
      - fix/triage-hospital-differentiation
    paths:
      - .github/workflows/apply-triage-hospital-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/triage-hospital-differentiation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply targeted source patches
        run: python scripts/apply_triage_hospital_fix.py
      - name: Remove one-shot patch helpers
        run: git rm scripts/apply_triage_hospital_fix.py .github/workflows/apply-triage-hospital-fix.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize triage-specific hospital recommendations"
          git push origin HEAD:fix/triage-hospital-differentiation
