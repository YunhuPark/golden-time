<!DOCTYPE html>
<html lang="ko" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/golden-time.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://golden-time.vercel.app/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Golden Time - 실시간 응급실 내비게이션</title>
    <meta name="description" content="실시간 응급실 병상 현황 및 최적 경로 안내. 응급 상황에서 가장 빠르게 치료받을 수 있는 병원을 찾아드립니다." />
    <meta name="keywords" content="응급실, 병원, 응급의료, 119, 병상, 실시간, 경로안내" />

    <!-- Open Graph (소셜 미디어) -->
    <meta property="og:title" content="Golden Time - 실시간 응급실 내비게이션" />
    <meta property="og:description" content="응급 상황에서 가장 빠르게 치료받을 수 있는 병원을 찾아드립니다." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://golden-time.vercel.app/" />
    <meta property="og:site_name" content="Golden Time" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Golden Time - 실시간 응급실 내비게이션" />
    <meta name="twitter:description" content="실시간 응급실 병상 현황과 최적 경로를 빠르게 확인하세요." />

    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Golden Time" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#FF3B30" />

    <!-- Security policy is delivered as an HTTP header from vercel.json. -->

    <!-- Kakao Maps SDK is the only critical external browser resource. -->
    <link rel="dns-prefetch" href="https://dapi.kakao.com" />
    <link rel="preconnect" href="https://dapi.kakao.com" crossorigin />

    <!-- Kakao Maps SDK will be loaded dynamically from main.tsx -->
    <!-- Static dark-mode attributes above prevent FOUC without inline JavaScript. -->
    <style id="initial-theme">
      html, body {
        background-color: #0A0E14;
        color: #E8EAED;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
